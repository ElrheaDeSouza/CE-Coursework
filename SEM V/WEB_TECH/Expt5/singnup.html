<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign-up</title>
    <script>
        function validate() {
            var firstname = document.getElementById("fn").value;
            var lastname = document.getElementById("ln").value;
            var birth_date = document.getElementById("dob").value;
            var branch_selected = "";
            var x = document.getElementsByName("branch");
            for (var i = 0; i < x.length; i++) {
                if (x[i].checked) {
                    branch_selected = x[i].value;
                    break;
                }
            }

            // Phone number validation
            var pn = document.getElementById("ph").value;
            var phone_pattern = /^[789]{1}[0-9]{9}$/;
            if (!phone_pattern.test(pn)) {
                alert("Invalid phone number. Must start with 7, 8, or 9 and be 10 digits long.");
                return false;
            }

            var a = document.getElementById("states");
            var state_selected = a.options[a.selectedIndex].value;
            var languages = document.getElementsByName("lang");
            var lan = "";
            for (var i = 0; i < languages.length; i++) {
                if (languages[i].checked) {
                    lan += languages[i].value + " ";
                }
            }

            // Validating first name
            if (firstname === "") {
                alert("Please enter First name");
                return false;
            }

            // Validating last name
            else if (lastname === "") {
                alert("Please enter Last name");
                return false;
            }

            // Validating date of birth
            else if (birth_date === "") {
                alert("Please select birth date");
                return false;
            }

            // Validating branch selection
            else if (branch_selected === "") {
                alert("Please select branch");
                return false;
            }

            // Validating state selection
            else if (state_selected === "") {
                alert("Please select state");
                return false;
            }

            // Validating language selection
            else if (lan === "") {
                alert("Please select languages");
                return false;
            }

            // Validating username
            var username = document.getElementById("name").value;
            var username_pattern = /^COMP[0-9]{2}$/;
            if (!username_pattern.test(username)) {
                alert("Invalid Username. Must start with COMP followed by 2 digits.");
                return false;
            }

            // Validating email
            var email = document.getElementById("ea").value;
            var email_pattern = /^([a-zA-Z0-9\.-]+)@([a-zA-Z0-9]+)\.([a-z]{2,})(\.[a-z]{2,})?$/;
            if (!email_pattern.test(email)) {
                alert("Invalid email format");
                return false;
            }

            // Validating password
            var password = document.getElementById("pw").value;
            if (password.length < 6 || password.length > 10) {
                alert("Password must be 6 to 10 characters long");
                return false;
            } 
            else if (!/[A-Z]/.test(password)) {
                alert("Password must contain at least one uppercase letter");
                return false;
            } 
            else if (!/[a-z]/.test(password)) {
                alert("Password must contain at least one lowercase letter");
                return false;
            } 
            else if (!/[0-9]/.test(password)) {
                alert("Password must contain at least one number");
                return false;
            } 
            else if (!/[\@\#\$\%\&\;\:\.\,]/.test(password)) {
                alert("Password must contain at least one special character @ # $ % & ; : . ,");
                return false;
            }

            // Form validated successfully
            alert("Form validated successfully\n" +
                "First name: " + firstname + "\n" +
                "Last name: " + lastname + "\n" +
                "Date of Birth: " + birth_date + "\n" +
                "Branch: " + branch_selected + "\n" +
                "State: " + state_selected + "\n" +
                "Languages: " + lan + "\n" +
                "Username: " + username + "\n" +
                "Email: " + email +
                "\nPhone Number: " + pn);
            return true;
        }
    </script>
</head>
<body>
    <form onsubmit="return validate()">
        <label>Enter First Name</label>
        <input type="text" id="fn" autocomplete="off"><br><br>

        <label>Enter Last Name</label>
        <input type="text" id="ln" autocomplete="off"><br><br>

        <label>Enter Date of Birth</label>
        <input type="date" id="dob"><br><br>

        <label>Select your branch</label>
        <input type="radio" id="r1" name="branch" value="Computer">Comp
        <input type="radio" id="r2" name="branch" value="Mechanical">Mech
        <input type="radio" id="r3" name="branch" value="Electronics">ECE
        <br><br>

        <label>Select state</label>
        <select id="states">
            <option value=""></option>
            <option value="Goa">Goa</option>
            <option value="Bombay">Bombay</option>
            <option value="Kerala">Kerala</option>
        </select>
        <br><br>

        <label>Select the languages</label><br>
        <input type="checkbox" id="eng" name="lang" value="English">English<br>
        <input type="checkbox" id="hin" name="lang" value="Hindi">Hindi<br>
        <input type="checkbox" id="kon" name="lang" value="Konkani">Konkani<br>
        <input type="checkbox" id="grk" name="lang" value="Greek">Greek<br><br>

        <label>Enter Name starting with COMP followed by 2 digits</label><br>
        <input type="text" id="name"><br><br>

        <label>Enter your phone number</label><br>
        <input type="textbox" id="ph"><br>

        <label>Enter your email address</label><br>
        <input type="text" id="ea"><br><br>

        <label>Enter Password</label>
        <input type="password" id="pw" autocomplete="off"><br><br>

        <input type="submit">
    </form> 
</body>
</html>
