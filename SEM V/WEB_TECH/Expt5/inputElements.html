<!DOCTYPE html>
<html lang="en">
<head>
    <title>Input Elements</title>
</head>
<body>
    <form>
        <label>Enter your First Name:</label><br>
        <input type="textbox" id="fn"><br><br>

        <label>select your state</label>
        <select id="ad">
            <option value=""></option>
            <option value="Goa">Goa</option>
            <option value="Bombay">Bombay</option>
            <option value="Kerala">Kerala</option>
        </select> <br><br>

        <label>Select your branch:</label><br>
        <input type="radio" id="Co" name="branch" value="Computer">Computer<br>
        <input type="radio" id="ECE" name="branch" value="Electrical">Electrical<br>
        <input type="radio" id="MECH" name="branch" value="Mechanical">Mechanical<br>

        <label>Select the languages you know</label><br>
        <input type="checkbox" value="English" name="lang">Eng<br><br>
        <input type="checkbox" value="Konkani" name="lang">Kon<br><br>
        <input type="checkbox" value="Hindi" name="lang">Hindi<br><br>
        <input type="checkbox" value="Greek" name="lang">Greek<br><br>

        <label for="username">Enter your username</label><br>
        <input type="textbox" id="usnm"> <br><br>

        <label>Enter your email address</label><br>
        <input type="textbox" id="ea"><br>

        <label>Enter your Password</label><br>
        <input type="password" id="psswrd"><br>

        <input type="submit">

    </form>
</body>
</html>
