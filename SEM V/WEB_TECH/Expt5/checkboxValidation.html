<!--4.Validation of Check boxes-->
<!DOCTYPE html>
<html lang="en">

<head>
    <title>Document</title>
    <script>
        function f1() {
            var x = document.getElementsByName("lang"); // array pointing to checkboxes
            var languages = ""; // Initialize an empty string

            for (var i = 0; i < x.length; i++) {
                // Check if the checkbox is checked
                if (x[i].checked) {
                    // Append the value of the checked box to the languages variable
                    languages += x[i].value + " ";
                }
            }
            if (languages == "") {
                alert("No values selected");
                return false;
            } else {
                alert("Values selected are " + languages);
                return true;
            }
        }
    </script>
</head>

<body>
    <form onsubmit="return f1()">
        <label>Select your subjects</label><br>
        <input type="checkbox" value="English" name="lang">Eng<br>
        <input type="checkbox" value="Konkani" name="lang">Kon<br>
        <input type="checkbox" value="Hindi" name="lang">Hindi<br>
        <input type="checkbox" value="Greek" name="lang">Greek<br>
        <input type="submit">
    </form>
</body>

</html>
