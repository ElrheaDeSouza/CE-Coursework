<!--Name validation-->
<!DOCTYPE html>
<html lang="en">
<head>
    <title>Document</title>
    <script>
        function validate()
        {
            var pn=document.getElementById("name").value;
            var x= /^COMP[0-9]{2}$/;
            if(x.test(pn)==false)
        {
            alert("Invalid");
        }
        else{
            alert("valid");
            document.write("User name  is:"+pn)
        }
        }
    </script>
</head>
<body>
    <form onsubmit="return validate()">
        <label>Enter Name starting with COMP followed by 2 digits</label><br>
        <input type="textbox" id="name"><br>
        <input type="submit">
    </form>
</body>
</html>
