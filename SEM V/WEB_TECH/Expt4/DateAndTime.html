<!--Displaying time and date-->
<!DOCTYPE html>
<html>
<head>
<title>Page Title</title>
</head>
<body>
    <script>
      var d = new Date();
      document.write("Today's date is "+ d);
     
      var d1 = new Date("2022-07-28");
      document.write("<br> <br>  The specified date is "+d1);
     
      var d2 = new Date("2022");
      document.write(" <br> <br> The specified date is "+d2);
     
      var d3 = new Date("2022-07");
      document.write(" <br> <br> The specified date is "+d3);
    </script>
 
</body>
</html>
