<!--Js to display the variables and their types-->

<!DOCTYPE html>
<html >
<head>
    <title>Document</title>
    <script>
      var a=98;
      var b=92.5;
      var c="comp";
      var d=false;
      var e=[21,35,45];
      var f={
        fname:"Amit",
        age:30
      };
      var g=null;

      document.write("<br> value of a "+a);
      document.write("<br>type of a "+typeof a);
      
      document.write("<br><br> value of b "+b);
      document.write("<br>type of b "+typeof b);

      document.write("<br><br> value of c "+c);
      document.write("<br>type of c "+typeof c);

      document.write("<br><br> value of d "+d);
      document.write("<br>type of d  "+typeof d);

      document.write("<br><br> value of e "+e);
      document.write("<br>type of e "+typeof e);

      document.write("<br><br> First name: " +f.fname);
      document.write("<br>Age: "+f.age);
      document.write("<br>Type of f is:"+typeof f);
      


      document.write("<br><br> value of g "+g);
      document.write("<br>type of g "+typeof g);



    </script>
</head>
<body>
    
</body>
</html>
